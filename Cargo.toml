[package]
name = "cargo-normalize"
version = "0.1.0"
edition = "2024"

[dependencies]
cargo_metadata = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
prettyplease = "0.3.0"
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
quote = "1.0.47"
serde = { version = "1.0.229", features = ["derive"] }
syn = { version = "3.0.9", features = ["full", "extra-traits", "parsing"] }
tempfile = "3.27.0"
toml = "1.2.1"
walkdir = "2.5.0"
