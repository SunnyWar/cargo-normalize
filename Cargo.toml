[package]
name = "cargo-normalize"
version = "0.1.0"
edition = "2024"

[dependencies]
cargo_metadata = "0.23.1"
clap = { version = "4.6.1", features = ["derive"] }
prettyplease = "0.2.37"
proc-macro2 = { version = "1.0.106", features = ["span-locations"] }
quote = "1.0.45"
serde = { version = "1.0.228", features = ["derive"] }
syn = { version = "2.0.117", features = ["full", "extra-traits", "parsing"] }
tempfile = "3.27.0"
toml = "0.9.8"
walkdir = "2.5.0"
